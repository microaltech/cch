name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest sudah menyertakan Android SDK (ANDROID_HOME); AGP mengunduh platform yang kurang.
      - uses: gradle/actions/setup-gradle@v4

      - name: Uji (Robolectric)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: BandiRush-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Unggah screenshot uji
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/shots/
          if-no-files-found: ignore
